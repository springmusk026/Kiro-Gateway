<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro-Go</title>
  <link rel="icon" type="image/png" href="/admin/icon.png?v=20260724" />
  <script src="/admin/vendor/tailwindcss-browser/index.global.js"></script>
  <link rel="stylesheet" href="/admin/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/admin/styles.css" id="__cssAsset" />
  <link rel="stylesheet" href="/admin/toast.css" id="__toastCss" />
  <link rel="stylesheet" href="/admin/dashboard.css" id="__dashCss" />
  <script>
    (function () {
      var v = Date.now();
      window.__v = v;
      var css = document.getElementById('__cssAsset');
      if (css) css.href = '/admin/styles.css?v=' + v;
      var dcss = document.getElementById('__dashCss');
      if (dcss) dcss.href = '/admin/dashboard.css?v=' + v;
      var tcss = document.getElementById('__toastCss');
      if (tcss) tcss.href = '/admin/toast.css?v=' + v;
    })();
  </script>
</head>

<body>
  <!-- Login -->
  <div id="loginPage" class="login-shell">
    <section class="login-aside" aria-hidden="true">
      <div class="login-aside-brand">
        <img class="brand-icon" src="/admin/icon.png?v=20260724" alt="" />
        <span>Kiro-Go</span>
      </div>
      <div class="login-aside-copy">
        <h2 data-i18n="login.heroTitle"></h2>
        <p data-i18n="login.heroText"></p>
        <ul class="login-points">
          <li><i class="fa-solid fa-layer-group"></i><span data-i18n="login.point1"></span></li>
          <li><i class="fa-solid fa-shield-halved"></i><span data-i18n="login.point2"></span></li>
          <li><i class="fa-solid fa-chart-line"></i><span data-i18n="login.point3"></span></li>
        </ul>
      </div>
      <div class="login-aside-foot">OpenAI · Anthropic · Responses API</div>
    </section>
    <section class="login-panel">
      <header class="login-topbar">
        <div class="brand login-brand-mobile">
          <img class="brand-icon" src="/admin/icon.png?v=20260724" alt="" />
          <span class="brand-text">Kiro-Go</span>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" id="loginLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="vi" type="button" data-i18n="lang.vi"></button>
          </div>
          <button id="loginThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
        </div>
      </header>
      <main class="login-main">
        <div class="login-box">
          <h1 class="login-title" data-i18n="login.title"></h1>
          <p class="login-subtitle" data-i18n="login.subtitle"></p>
          <div class="form-group">
            <label for="pwdField" data-i18n="login.password"></label>
            <div class="input-affix">
              <i class="fa-solid fa-lock affix-icon"></i>
              <input type="password" id="pwdField" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="current-password" />
              <button type="button" class="affix-btn" id="pwdToggle" aria-label=""
                data-i18n-aria-label="login.showPassword" data-shown="false">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <label class="remember-row" for="rememberPwd">
            <input type="checkbox" id="rememberPwd" />
            <span class="remember-box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <span class="remember-label" data-i18n="login.remember"></span>
          </label>
          <button type="button" class="btn btn-primary btn-lg w-full" id="loginBtn">
            <span data-i18n="login.submit"></span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
          <p class="login-hint" data-i18n="login.hint"></p>
        </div>
      </main>
    </section>
  </div>

  <!-- Main app -->
  <div id="mainPage" class="hidden app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="" data-i18n-aria-label="aria.sections">
      <div class="sidebar-brand">
        <img class="brand-icon" src="/admin/icon.png?v=20260724" alt="" />
        <div class="sidebar-brand-text">
          <span class="brand-text">Kiro-Go</span>
          <span class="sidebar-brand-sub" data-i18n="nav.subtitle"></span>
        </div>
      </div>
      <nav class="sidebar-nav" id="tabBar">
        <div class="nav-section" data-i18n="nav.sectionWorkspace"></div>
          <button type="button" class="tab active" data-tab="overview"><i class="fa-solid fa-gauge-high tab-icon"></i><span data-i18n="nav.overview"></span></button>
          <button type="button" class="tab" data-tab="accounts"><i class="fa-solid fa-users tab-icon"></i><span data-i18n="nav.accounts"></span></button>
          <button type="button" class="tab" data-tab="models"><i class="fa-solid fa-cubes tab-icon"></i><span data-i18n="nav.models"></span></button>
          <button type="button" class="tab" data-tab="playground"><i class="fa-solid fa-flask tab-icon"></i><span data-i18n="nav.playground"></span></button>
        <div class="nav-section" data-i18n="nav.sectionDevelopers"></div>
          <button type="button" class="tab" data-tab="api"><i class="fa-solid fa-plug tab-icon"></i><span data-i18n="nav.api"></span></button>
          <button type="button" class="tab" data-tab="logs"><i class="fa-solid fa-list-ul tab-icon"></i><span data-i18n="nav.logs"></span></button>
        <div class="nav-section" data-i18n="nav.sectionSystem"></div>
          <button type="button" class="tab" data-tab="settings"><i class="fa-solid fa-gear tab-icon"></i><span data-i18n="nav.settings"></span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-version">
          <span class="status-dot" id="statusBadge" data-i18n-title="status.running" title=""></span>
          <span class="footer-version" id="versionBadge" aria-label="" data-i18n-aria-label="footer.version"></span>
        </div>
        <div class="sidebar-links">
          <button class="footer-link" id="checkUpdateBtn" type="button">
            <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
            <span data-i18n="update.check" data-update-label></span>
          </button>
          <a class="footer-link" href="https://github.com/springmusk026/Kiro-Go" target="_blank" rel="noopener">
            <i class="fa-brands fa-github" aria-hidden="true"></i>
            <span data-i18n="footer.github"></span>
          </a>
        </div>
        <div class="footer-meta">© <span id="footerYear"></span> Kiro-Go</div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" type="button" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-titles">
          <h1 class="page-title" id="pageTitle"></h1>
          <p class="page-subtitle" id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" id="mainLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="vi" type="button" data-i18n="lang.vi"></button>
          </div>
          <button id="mainThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
          <button class="btn btn-outline btn-sm" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span class="btn-text" data-i18n="common.logout"></span>
          </button>
        </div>
      </header>

      <main class="container">
      <!-- Overview tab -->
      <div id="tabOverview" class="tab-content">
        <div class="notice notice-warn hidden" id="ovOpenNotice" role="alert">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <div><strong data-i18n="overview.openTitle"></strong><p data-i18n="overview.openText"></p></div>
          <button class="btn btn-outline btn-sm" type="button" data-goto="settings" data-i18n="overview.openAction"></button>
        </div>
        <div class="stats-grid stats-grid--overview">
          <div class="stat-card">
            <div class="stat-card-title" data-i18n="stats.accounts"></div>
            <div class="stat-value" id="statAccounts">0</div>
            <div class="stat-sub"><span id="ovAvailable">0</span> <span data-i18n="overview.available"></span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-title" data-i18n="stats.requests"></div>
            <div class="stat-value" id="statRequests">0</div>
            <div class="stat-sub"><span id="ovSuccessRate">–</span> <span data-i18n="overview.successRate"></span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-title" data-i18n="stats.tokens"></div>
            <div class="stat-value" id="statTokens">0</div>
            <div class="stat-sub"><span id="statCredits">0</span> <span data-i18n="stats.credits"></span></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-title" data-i18n="overview.health"></div>
            <div class="stat-value stat-value--split"><span id="statSuccess">0</span><span class="stat-divider">/</span><span class="stat-value--danger" id="statFailed">0</span></div>
            <div class="stat-sub"><span data-i18n="stats.success"></span> / <span data-i18n="stats.failed"></span> · <span data-i18n="overview.uptime"></span> <span id="ovUptime">–</span></div>
          </div>
        </div>

        <div class="overview-grid">
          <div class="card">
            <div class="card-header">
              <span class="card-title" data-i18n="overview.traffic"></span>
              <span class="card-hint" data-i18n="overview.trafficHint"></span>
            </div>
            <div id="ovChart" class="ov-chart"></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title" data-i18n="overview.quickStart"></span></div>
            <div class="quickstart">
              <label class="field-label" data-i18n="overview.baseUrl"></label>
              <div class="code-inline" id="ovBaseUrl"></div>
              <label class="field-label" data-i18n="overview.example"></label>
              <pre class="code-block" id="ovCurl"></pre>
              <div class="quickstart-actions">
                <button class="btn btn-outline btn-sm" type="button" data-goto="playground"><i class="fa-solid fa-flask"></i><span data-i18n="nav.playground"></span></button>
                <button class="btn btn-outline btn-sm" type="button" data-goto="models"><i class="fa-solid fa-cubes"></i><span data-i18n="nav.models"></span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="overview.recent"></span>
            <button class="btn btn-ghost btn-sm" type="button" data-goto="logs"><span data-i18n="overview.viewAll"></span><i class="fa-solid fa-arrow-right"></i></button>
          </div>
          <div id="ovRecent" class="table-wrap"></div>
        </div>
      </div>


      <!-- Accounts tab -->
      <div id="tabAccounts" class="tab-content hidden">
        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="accounts.title"></span>
            <div class="card-actions">
              <label class="flex items-center gap-2 cursor-pointer select-none" title=""
                data-i18n-title="privacy.tooltip">
                <span class="text-xs font-medium" data-i18n="privacy.label"></span>
                <span class="switch"><input type="checkbox" id="privacyModeToggle" checked /><span
                    class="slider"></span></span>
              </label>
              <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fa-solid fa-file-export"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.export"></span></button>
              <button class="btn btn-outline btn-sm" id="refreshAllModelsBtn"><i class="fa-solid fa-arrows-rotate"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="models.refreshAll"></span></button>
              <button class="btn btn-primary btn-sm" id="addAccountBtn"><i class="fa-solid fa-plus"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.add"></span></button>
            </div>
          </div>

          <div class="toolbar">
            <label class="flex items-center gap-1.5 cursor-pointer select-none shrink-0">
              <input type="checkbox" id="selectAllCheckbox" />
              <span class="text-xs" data-i18n="batch.selectAll"></span>
            </label>
            <div id="batchBar" class="batch-bar hidden">
              <span id="batchCount" class="batch-count"></span>
              <button class="btn btn-primary btn-xs" data-batch="enable" data-i18n="batch.enable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="disable" data-i18n="batch.disable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refresh" data-i18n="batch.refresh"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refreshModels"
                data-i18n="batch.refreshModels"></button>
              <button class="btn btn-danger btn-xs" data-batch="delete" data-i18n="batch.delete"></button>
            </div>
            <div class="toolbar-spacer"></div>
            <input type="text" id="filterSearch" class="w-56!" data-i18n-placeholder="filter.search" />
            <select id="filterStatusSelect" class="w-32!" data-i18n-aria-label="filter.status">
              <option value="all" data-i18n="filter.all"></option>
              <option value="enabled" data-i18n="filter.enabled"></option>
              <option value="disabled" data-i18n="filter.disabled"></option>
              <option value="banned" data-i18n="filter.banned"></option>
            </select>
          </div>

          <div id="accountsList"></div>
        </div>
      </div>

      <!-- Models tab -->
      <div id="tabModels" class="tab-content hidden">
        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="models.catalogTitle"></span>
            <div class="card-actions">
              <input type="text" id="modelsSearch" class="w-56!" data-i18n-placeholder="models.search" />
              <button class="btn btn-primary btn-sm" id="modelsRefreshBtn" type="button"><i class="fa-solid fa-arrows-rotate"></i><span class="btn-text" data-i18n="models.refreshNow"></span></button>
            </div>
          </div>
          <p class="card-hint block mb-3" id="modelsMeta"></p>
          <div id="modelsTable" class="table-wrap"></div>
        </div>
      </div>

      <!-- Playground tab -->
      <div id="tabPlayground" class="tab-content hidden">
        <div class="playground">
          <div class="card playground-config">
            <div class="card-header"><span class="card-title" data-i18n="playground.settings"></span></div>
            <div class="form-group">
              <label for="pgModel" data-i18n="playground.model"></label>
              <select id="pgModel"></select>
            </div>
            <div class="form-group">
              <label for="pgProtocol" data-i18n="playground.protocol"></label>
              <select id="pgProtocol">
                <option value="openai">OpenAI · /v1/chat/completions</option>
                <option value="anthropic">Anthropic · /v1/messages</option>
              </select>
            </div>
            <div class="form-group">
              <label for="pgSystem" data-i18n="playground.system"></label>
              <textarea id="pgSystem" rows="4" data-i18n-placeholder="playground.systemPlaceholder"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="pgTemp"><span data-i18n="playground.temperature"></span> <span class="muted-text" id="pgTempVal">0.7</span></label>
                <input type="range" id="pgTemp" min="0" max="1" step="0.05" value="0.7" />
              </div>
              <div class="form-group">
                <label for="pgMaxTokens" data-i18n="playground.maxTokens"></label>
                <input type="number" id="pgMaxTokens" min="1" max="64000" value="2048" />
              </div>
            </div>
            <label class="flex items-center gap-2 mb-3">
              <span class="switch"><input type="checkbox" id="pgStream" checked /><span class="slider"></span></span>
              <span data-i18n="playground.stream"></span>
            </label>
            <button class="btn btn-outline btn-sm w-full" id="pgCurlBtn" type="button"><i class="fa-solid fa-terminal"></i><span data-i18n="playground.copyCurl"></span></button>
          </div>
          <div class="card playground-chat">
            <div class="card-header">
              <span class="card-title" data-i18n="playground.chat"></span>
              <div class="card-actions">
                <span class="pg-metrics" id="pgMetrics"></span>
                <button class="btn btn-ghost btn-sm" id="pgClearBtn" type="button"><i class="fa-solid fa-eraser"></i><span class="btn-text" data-i18n="playground.clear"></span></button>
              </div>
            </div>
            <div class="pg-messages" id="pgMessages"></div>
            <div class="pg-composer">
              <textarea id="pgInput" rows="3" data-i18n-placeholder="playground.inputPlaceholder"></textarea>
              <div class="pg-composer-actions">
                <span class="muted-text text-xs" data-i18n="playground.sendHint"></span>
                <button class="btn btn-secondary btn-sm hidden" id="pgStopBtn" type="button"><i class="fa-solid fa-stop"></i><span data-i18n="playground.stop"></span></button>
                <button class="btn btn-primary btn-sm" id="pgSendBtn" type="button"><i class="fa-solid fa-paper-plane"></i><span data-i18n="playground.send"></span></button>
              </div>
            </div>
          </div>
        </div>
      </div>


      <!-- Settings tab -->
      <div id="tabSettings" class="tab-content hidden">
        <!-- API settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.apiSettings"></span></div>
          <div class="form-group">
            <label class="flex items-center gap-2">
              <span class="switch"><input type="checkbox" id="requireApiKey" /><span class="slider"></span></span>
              <span data-i18n="settings.enableApiKey"></span>
            </label>
            <small data-i18n="apiKeys.requireHint"></small>
          </div>
          <button class="btn btn-primary btn-sm" id="saveRequireApiKeyBtn" data-i18n="settings.saveApiKey"></button>

          <div class="form-group" style="margin-top: 1rem;">
            <div class="flex items-center gap-2" style="justify-content: space-between;">
              <label class="font-semibold" data-i18n="apiKeys.listTitle"></label>
              <button class="btn btn-outline btn-sm" id="addApiKeyBtn" type="button">
                <i class="fa-solid fa-plus"></i>
                <span data-i18n="apiKeys.add"></span>
              </button>
            </div>
            <small data-i18n="apiKeys.listHint"></small>
          </div>
          <div id="apiKeysList"></div>
        </div>

        <!-- Usage settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.usageSettings"></span></div>
          <div class="form-group">
            <label class="flex items-center gap-2">
              <span class="switch"><input type="checkbox" id="allowOverUsage" /><span class="slider"></span></span>
              <span data-i18n="settings.allowOverUsage"></span>
            </label>
            <small data-i18n="settings.allowOverUsageHint"></small>
          </div>
          <button class="btn btn-primary" id="saveOverUsageBtn" data-i18n="settings.saveUsage"></button>
        </div>

        <!-- Thinking settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.thinkingSettings"></span></div>
          <div class="form-group">
            <label data-i18n="settings.thinkingSuffix"></label>
            <input type="text" id="thinkingSuffix" placeholder="-thinking" />
            <small data-i18n="settings.thinkingSuffixHint"></small>
          </div>
          <div class="form-group">
            <label data-i18n="settings.openaiFormat"></label>
            <select id="openaiThinkingFormat">
              <option value="reasoning_content" data-i18n="settings.formatReasoningContent"></option>
              <option value="thinking" data-i18n="settings.formatThinkingClaude"></option>
              <option value="think" data-i18n="settings.formatThinkOpenAI"></option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="settings.claudeFormat"></label>
            <select id="claudeThinkingFormat">
              <option value="thinking" data-i18n="settings.formatThinkingClaude"></option>
              <option value="think" data-i18n="settings.formatThinkOpenAI"></option>
            </select>
          </div>
          <button class="btn btn-primary" id="saveThinkingBtn" data-i18n="settings.saveThinking"></button>
        </div>

        <!-- Model mapping settings -->
        <div class="card">
          <div class="card-header model-mapping-header">
            <span class="card-title" data-i18n="modelMappings.title"></span>
            <button class="btn btn-outline btn-sm" id="addModelMappingBtn" type="button">
              <i class="fa-solid fa-plus"></i>
              <span data-i18n="modelMappings.add"></span>
            </button>
          </div>
          <small class="block mb-3" data-i18n="modelMappings.hint"></small>
          <div id="modelMappingsList"></div>
          <button class="btn btn-primary" id="saveModelMappingsBtn" type="button"
            data-i18n="modelMappings.save"></button>
        </div>

        <!-- Endpoint settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.endpointSettings"></span></div>
          <div class="form-group">
            <label for="upstreamProtocol" data-i18n="settings.upstreamProtocol"></label>
            <select id="upstreamProtocol">
              <option value="auto" data-i18n="settings.protocolAuto"></option>
              <option value="responses" data-i18n="settings.protocolResponses"></option>
              <option value="legacy" data-i18n="settings.protocolLegacy"></option>
            </select>
            <small data-i18n="settings.upstreamProtocolHint"></small>
          </div>
          <div class="form-group">
            <label data-i18n="settings.preferredEndpoint"></label>
            <select id="preferredEndpoint">
              <option value="auto" data-i18n="settings.endpointAuto"></option>
              <option value="kiro" data-i18n="settings.endpointKiro"></option>
              <option value="codewhisperer" data-i18n="settings.endpointCodeWhisperer"></option>
              <option value="amazonq" data-i18n="settings.endpointAmazonQ"></option>
            </select>
            <small data-i18n="settings.endpointHint"></small>
          </div>
          <div class="form-group">
            <label class="flex items-center gap-2">
              <span class="switch"><input type="checkbox" id="endpointFallback" checked /><span
                  class="slider"></span></span>
              <span data-i18n="settings.endpointFallback"></span>
            </label>
            <small data-i18n="settings.endpointFallbackHint"></small>
          </div>
          <button class="btn btn-primary" id="saveEndpointBtn" data-i18n="settings.saveEndpoint"></button>
        </div>

        <!-- Admin password -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.adminPassword"></span></div>
          <div class="form-group">
            <label data-i18n="settings.newPassword"></label>
            <input type="password" id="newPassword" data-i18n-placeholder="settings.newPasswordPlaceholder" />
          </div>
          <button class="btn btn-primary" id="changePasswordBtn" data-i18n="settings.changePassword"></button>
        </div>

        <!-- Outbound proxy -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.proxySettings"></span></div>
          <div class="form-group">
            <label data-i18n="settings.proxyType"></label>
            <select id="proxyType">
              <option value="none" data-i18n="settings.proxyNone"></option>
              <option value="socks5" data-i18n="settings.proxySocks5"></option>
              <option value="http" data-i18n="settings.proxyHttp"></option>
            </select>
          </div>
          <div id="proxyFields" class="hidden">
            <div class="form-group">
              <label data-i18n="settings.proxyHost"></label>
              <div class="input-row">
                <input type="text" id="proxyHost" placeholder="127.0.0.1" />
                <input type="number" id="proxyPort" class="w-24!" placeholder="1080" min="1" max="65535" />
              </div>
            </div>
            <div class="form-group">
              <label data-i18n="settings.proxyAuth"></label>
              <div class="input-row">
                <input type="text" id="proxyUsername" data-i18n-placeholder="settings.proxyUsername"
                  autocomplete="off" />
                <input type="password" id="proxyPassword" data-i18n-placeholder="settings.proxyPassword"
                  autocomplete="new-password" />
              </div>
            </div>
          </div>
          <button class="btn btn-primary" id="saveProxyBtn" data-i18n="settings.saveProxy"></button>
        </div>

        <!-- Prompt filter -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.promptFilter"></span></div>
          <div class="form-group">
            <label class="font-semibold pb-2 block" data-i18n="settings.builtinFilters"></label>
            <div class="flex flex-col gap-3">
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterClaudeCode" /><span
                      class="slider"></span></span>
                  <span data-i18n="settings.filterClaudeCode"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterClaudeCodeHint"></small>
              </div>
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterEnvNoise" /><span class="slider"></span></span>
                  <span data-i18n="settings.filterEnvNoise"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterEnvNoiseHint"></small>
              </div>
              <div>
                <label class="flex items-center gap-2">
                  <span class="switch"><input type="checkbox" id="filterStripBoundaries" /><span
                      class="slider"></span></span>
                  <span data-i18n="settings.filterStripBoundaries"></span>
                </label>
                <small class="field-hint-offset" data-i18n="settings.filterStripBoundariesHint"></small>
              </div>
            </div>
          </div>
          <div class="form-group mt-4">
            <label class="font-semibold pb-2 block" data-i18n="settings.customRules"></label>
            <div id="promptFilterRules" class="mb-2"></div>
            <div class="flex gap-2 flex-wrap items-center">
              <button class="btn btn-outline btn-sm" id="addRuleRegexBtn" data-i18n="promptFilter.addRegex"></button>
              <button class="btn btn-outline btn-sm" id="addRuleContainsBtn"
                data-i18n="promptFilter.addContains"></button>
              <button class="btn btn-primary btn-sm" id="savePromptFilterBtn"
                data-i18n="settings.savePromptFilter"></button>
            </div>
          </div>
        </div>

        <!-- Statistics reset -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.statistics"></span></div>
          <button class="btn btn-danger" id="resetStatsBtn" data-i18n="settings.resetStats"></button>
        </div>
      </div>

      <!-- API tab -->
      <div id="tabApi" class="tab-content hidden">
        <section class="api-card" aria-labelledby="apiEndpointsTitle">
          <div class="card-header api-card-header">
            <span class="card-title" id="apiEndpointsTitle" data-i18n="api.endpoints"></span>
            <span class="api-pill" data-i18n="api.protocolHttp"></span>
          </div>
          <div class="api-endpoint-list">
            <section class="api-endpoint-item">
              <div class="api-endpoint-meta">
                <span class="api-endpoint-icon"><i class="fa-solid fa-message"></i></span>
                <div>
                  <p class="api-endpoint-title" data-i18n="api.claude"></p>
                  <p class="api-endpoint-method" data-i18n="api.methodPost"></p>
                </div>
              </div>
              <div class="endpoint api-code-row"><span class="api-code" id="claudeEndpoint"></span><button
                  class="api-copy-btn" type="button" data-copy="claudeEndpoint" aria-label=""
                  data-i18n-aria-label="api.copyClaude"><i class="fa-regular fa-copy"></i></button></div>
            </section>
            <section class="api-endpoint-item">
              <div class="api-endpoint-meta">
                <span class="api-endpoint-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                <div>
                  <p class="api-endpoint-title" data-i18n="api.openai"></p>
                  <p class="api-endpoint-method" data-i18n="api.methodPost"></p>
                </div>
              </div>
              <div class="endpoint api-code-row"><span class="api-code" id="openaiEndpoint"></span><button
                  class="api-copy-btn" type="button" data-copy="openaiEndpoint" aria-label=""
                  data-i18n-aria-label="api.copyOpenAI"><i class="fa-regular fa-copy"></i></button></div>
            </section>
            <section class="api-endpoint-item">
              <div class="api-endpoint-meta">
                <span class="api-endpoint-icon"><i class="fa-solid fa-comments"></i></span>
                <div>
                  <p class="api-endpoint-title" data-i18n="api.openaiResponses"></p>
                  <p class="api-endpoint-method" data-i18n="api.methodPost"></p>
                </div>
              </div>
              <div class="endpoint api-code-row"><span class="api-code" id="openaiResponsesEndpoint"></span><button
                  class="api-copy-btn" type="button" data-copy="openaiResponsesEndpoint" aria-label=""
                  data-i18n-aria-label="api.copyOpenAIResponses"><i class="fa-regular fa-copy"></i></button></div>
            </section>
            <section class="api-endpoint-item">
              <div class="api-endpoint-meta">
                <span class="api-endpoint-icon"><i class="fa-solid fa-layer-group"></i></span>
                <div>
                  <p class="api-endpoint-title" data-i18n="api.modelList"></p>
                  <p class="api-endpoint-method" data-i18n="api.methodGet"></p>
                </div>
              </div>
              <div class="endpoint api-code-row"><span class="api-code" id="modelsEndpoint"></span><button
                  class="api-view-btn" type="button" id="viewModelsBtn" aria-label=""
                  data-i18n-aria-label="api.viewModels"><i class="fa-solid fa-eye"></i></button><button
                  class="api-copy-btn" type="button" data-copy="modelsEndpoint" aria-label=""
                  data-i18n-aria-label="api.copyModels"><i class="fa-regular fa-copy"></i></button></div>
            </section>
            <section class="api-endpoint-item">
              <div class="api-endpoint-meta">
                <span class="api-endpoint-icon"><i class="fa-solid fa-chart-simple"></i></span>
                <div>
                  <p class="api-endpoint-title" data-i18n="api.stats"></p>
                  <p class="api-endpoint-method" data-i18n="api.methodGet"></p>
                </div>
              </div>
              <div class="endpoint api-code-row"><span class="api-code" id="statsEndpoint"></span><button
                  class="api-view-btn" type="button" id="viewStatsBtn" aria-label=""
                  data-i18n-aria-label="api.viewStats"><i class="fa-solid fa-eye"></i></button><button
                  class="api-copy-btn" type="button" data-copy="statsEndpoint" aria-label=""
                  data-i18n-aria-label="api.copyStats"><i class="fa-regular fa-copy"></i></button></div>
            </section>
          </div>
          <p class="api-hint"><i class="fa-solid fa-key"></i><span data-i18n="api.statsHint"></span></p>
        </section>
      </div>

      <!-- Logs tab -->
      <div id="tabLogs" class="tab-content hidden">
        <div class="card">
          <div class="card-header logs-header">
            <span class="card-title" data-i18n="logs.title"></span>
            <div class="logs-actions">
              <select id="logsFilterSelect" class="w-40!" data-i18n-aria-label="logs.filter">
                <option value="all" data-i18n="logs.filterAll"></option>
                <option value="success" data-i18n="logs.filterSuccess"></option>
                <option value="error" data-i18n="logs.filterError"></option>
              </select>
              <button class="btn btn-outline btn-sm" id="logsRefreshBtn"><i class="fa-solid fa-rotate"></i><span class="btn-text" data-i18n="logs.refresh"></span></button>
              <label class="logs-auto-toggle"><input type="checkbox" id="logsAutoRefresh" /> <span data-i18n="logs.autoRefresh"></span></label>
              <button class="btn btn-danger btn-sm" id="logsClearBtn"><i class="fa-solid fa-trash"></i><span class="btn-text" data-i18n="logs.clear"></span></button>
            </div>
          </div>
          <div class="logs-summary" id="logsSummary"></div>
          <div id="logsList" class="logs-list">
            <p class="text-muted" data-i18n="logs.empty"></p>
          </div>
        </div>
      </div>
      </main>
    </div>
  </div>

  <!-- Modals -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><span class="modal-title" id="modalTitle"></span><button class="modal-close"

  <div id="apiKeyModal" class="modal">

        <span class="modal-title" id="apiKeyModalTitle" data-i18n="apiKeys.modalTitleCreate"></span>

          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label data-i18n="apiKeys.formName"></label>
          <input type="text" id="apiKeyForm_name" data-i18n-placeholder="apiKeys.formNamePlaceholder" />
        </div>
        <div class="form-group">
          <label data-i18n="apiKeys.formKey"></label>
          <input type="text" id="apiKeyForm_key" data-i18n-placeholder="apiKeys.formKeyPlaceholder" />
        </div>
        <div class="form-group">
          <label class="flex items-center gap-2">
            <span class="switch"><input type="checkbox" id="apiKeyForm_enabled" checked /><span class="slider"></span></span>
            <span data-i18n="apiKeys.formEnabled"></span>
          </label>
        </div>
        <div class="form-group">
          <label data-i18n="apiKeys.limitTokens"></label>
          <input type="number" id="apiKeyForm_tokenLimit" min="0" step="1" value="0" />

        <div class="form-group">
          <label data-i18n="apiKeys.limitCredits"></label>
          <input type="number" id="apiKeyForm_creditLimit" min="0" step="0.01" value="0" />
          <small data-i18n="apiKeys.limitHint"></small>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="apiKeyModalCancelBtn" type="button" data-i18n="apiKeys.cancelBtn"></button>
          <button class="btn btn-primary" id="apiKeyModalSaveBtn" type="button" data-i18n="apiKeys.saveBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="apiKeyShowModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" data-i18n="apiKeys.showTitle"></span>
        <button class="modal-close" id="apiKeyShowClose" type="button" aria-label=""
          data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message" data-i18n="apiKeys.showWarning"></p>
        <div class="form-group">
          <input type="text" id="apiKeyShowValue" readonly />
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="apiKeyShowCopyBtn" type="button" data-i18n="apiKeys.copyBtn"></button>
          <button class="btn btn-primary" id="apiKeyShowCloseBtn" type="button" data-i18n="apiKeys.closeBtn"></button>
        </div>
