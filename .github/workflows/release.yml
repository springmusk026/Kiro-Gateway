name: Release

# On a version tag: build the console and the binaries, and publish a GitHub
# Release whose notes are the tag's section of CHANGELOG.md. Docker images
# for the tag are published by docker.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section starts at "## <version>" (optionally followed by a title)
          # and ends before the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## $version' section (or it is empty). Add release notes for $GITHUB_REF_NAME before tagging."
            exit 1
          fi
          cat notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build console
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:only

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries and archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="kiro-gateway-${GITHUB_REF_NAME}-${os}-${arch}"
            stage="build/${name}"
            mkdir -p "$stage"
            exe="kiro-gateway"; [ "$os" = windows ] && exe="kiro-gateway.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$stage/$exe" .
            # The binary serves the console from ./web next to where it runs.
            cp -r frontend/dist/client "$stage/web"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -C build -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
